name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        required: false
        default: "false"
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make lint
      - run: make test
      - run: make build
      - name: Check whether version is already on PyPI
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if curl -sf "https://pypi.org/pypi/ansible-agent-callback/${VERSION}/json" >/dev/null 2>&1; then
            echo "Version ${VERSION} already published; skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} not on PyPI; will publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && steps.ver.outputs.exists == 'false' }}
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
      - name: Extract release notes
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        run: awk '/^## \[/{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - name: Create GitHub release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
