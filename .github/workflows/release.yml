name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        required: false
        default: "false"
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: make lint
      - run: make test
      - run: make build
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
