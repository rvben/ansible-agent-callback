name: CLI health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: clispec v0.3
    uses: rvben/clispec/.github/workflows/conformance.yml@ee6aa486a3c7f3e859947ab178ad5ac0d5182ba6
    with:
      binary: .venv/bin/ansible-agent-callback
      build-system: uv

  published-artifacts:
    name: Published artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: rvben/clispec/.github/workflows/published-artifacts.yml@703da8137f537dbd03714761a2da8e1fb026c8c7
    with:
      pypi: ansible-agent-callback
