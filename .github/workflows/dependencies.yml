name: Dependency health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@c3215394f3c07a0252e9c759eb23c8b83072f7b2 # v0.16.0
    with:
      langs: python,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: python3 -m pip install uv
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
