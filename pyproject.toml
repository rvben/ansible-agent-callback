[project]
name = "ansible-agent-callback"
version = "0.3.3"
description = "Token-optimized Ansible output for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ruben Jongejan", email = "ruben.jongejan@gmail.com" }]
keywords = ["ansible", "callback", "ai", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
ansible-agent-callback = "ansible_agent_callback.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ansible-core>=2.17",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff.lint.per-file-ignores]
"callback_plugins/agent.py" = ["E402"]
"src/ansible_agent_callback/plugin.py" = ["E402"]
