[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "ruff check --fix"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "ruff format"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "rumdl check"
language = "system"
types = ["markdown"]
